name: Generate Chapter Images

on:
  push:
    paths:
      - 'docs/capitulos/*.md'
      - 'scripts/generate_image.py'
  workflow_dispatch:

jobs:
  generate-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi

      - name: Generate Images
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Identify changed markdown files
          # Handle the case where before is null (new branch) by comparing against parent
          BASE_SHA=${{ github.event.before }}
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD^"
          fi

          echo "Comparing $BASE_SHA to ${{ github.sha }}"

          CHANGED_FILES=$(git diff --name-only $BASE_SHA ${{ github.sha }} | grep '^docs/capitulos/.*\.md$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No chapter files changed."
            exit 0
          fi

          echo "Processing files: $CHANGED_FILES"

          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              echo "Generating image for $file..."
              python3 scripts/generate_image.py "$file"
            else
              echo "File $file was deleted, skipping."
            fi
          done

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Add any new images in docs/public/midia/
          git add docs/public/midia/

          # Commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: generate chapter images [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
